services:
  floci-az:
    image: floci/floci-az:latest

    ports:
      - "4577:4577"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

    environment:
      # Floci
      FLOCI_AZ_TLS_ENABLED: "true"

      # Entra ID
      FLOCI_AZ_SERVICES_ENTRA_ENABLED: "true"
      FLOCI_AZ_SERVICES_ENTRA_DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000002"

      # MariaDB
      FLOCI_AZ_SERVICES_MARIA_DB_ENABLED: "true"
      FLOCI_AZ_SERVICES_MARIA_DB_MOCKED: "false"
      FLOCI_AZ_SERVICES_MARIA_DB_IMAGE: "mariadb:10.11"
      FLOCI_AZ_SERVICES_MARIA_DB_STARTUP_TIMEOUT_SECONDS: "60"
      FLOCI_AZ_SERVICES_MARIA_DB_DEFAULT_PORT: "0"